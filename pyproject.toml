[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "UnigramAccess"
dynamic = ["version"]
description = "UnigramAccess NVDA add-on"
maintainers = [
	{name = "Mahdi Sharifi", email = "mahdii.sh7@gmail.com"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.txt"}
dependencies = []
[project.urls]
Repository = "https://github.com/mahdish7/UnigramAccess"

[dependency-groups]
build = [
	"scons>=4.10.1",
	"Markdown>=3.10",
]
lint = [
	"ruff>=0.14.5",
	"pyright>=1.1.407",
]
dev = [
	{ include-group = "build" },
	{ include-group = "lint" },
]

[tool.ruff]
line-length = 110

builtins = [
	"_",
	"ngettext",
	"pgettext",
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
	"buildVars.py",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
"sconstruct" = ["F821"]

[tool.pyright]
venvPath = ".venv"
venv = "."
pythonPlatform = "Windows"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	".venv",
	"site_scons",
]

extraPaths = [
	"./addon",
]

analyzeUnannotatedFunctions = true
deprecateTypingAliases = true
reportMissingTypeStubs = false
